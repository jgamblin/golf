[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "golf-range-analytics"
version = "0.1.0"
description = "Range-session analytics, recommendations, and GitHub Pages publishing."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Jerry Gamblin" }
]
dependencies = [
  "pyyaml>=6.0",
]

[project.scripts]
golf-build = "golf.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/golf"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.uv]
dev-dependencies = [
  "pytest>=8.0",
  "ruff>=0.4",
]
